services:
  app:
    container_name: neuromatrix3d
    image: ghcr.io/b-x-y/neuromatrix3d:latest
    pull_policy: always
    healthcheck:
      test: ["CMD", "python3", "/app/matrix_health_check.py"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - ./logs:/app/logs
    env_file:
      - path: .env
        required: false
    ports:
      - "${MATRIX_PORT:-5000}:${MATRIX_PORT:-5000}"
    tty: true
    stdin_open: true
    mem_limit: 2g
